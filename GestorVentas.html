    <main class="main-content">
        <div class="dashboard-container">
            <h1 class="dashboard-title">Formulario de registro de venta</h1>

            <form class="venta-form">
                <div class="form-section">
                    <h2 class="section-title">Datos del usuario</h2>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="nombre">Nombre</label>
                            <input type="text" id="nombre" placeholder="Nombre del cliente">
                        </div>
                        <div class="form-group">
                            <label for="apellido">Apellido</label>
                            <input type="text" id="apellido" placeholder="Apellido del cliente">
                        </div>
                        <div class="form-group">
                            <label for="documento">Documento</label>
                            <input type="text" id="documento" placeholder="Número de documento">
                        </div>
                    </div>
                </div>

                <div class="form-section">
                    <h2 class="section-title">Productos a elegir</h2>
                    <div class="producto-item">
                        <div class="producto-select">
                            <label>Producto</label>
                            <select class="producto-dropdown">
                                <option value="">Seleccionar producto...</option>
                                <option value="1">Producto 1 - $50.000</option>
                                <option value="2">Producto 2 - $75.000</option>
                                <option value="3">Producto 3 - $120.000</option>
                                <option value="4">Producto 4 - $200.000</option>
                                <option value="5">Producto 5 - $35.000</option>
                            </select>
                        </div>
                        <div class="producto-cantidad">
                            <label>Cantidad</label>
                            <input type="number" value="1" min="1">
                        </div>
                    </div>
                    <button type="button" class="btn-add-producto">+ Añadir otro producto</button>
                </div>

                <div class="form-section">
                    <h2 class="section-title">Total a pagar</h2>
                    <div class="totales-grid">
                        <div class="total-item">
                            <span>Valor unitario</span>
                            <span class="total-valor">$50.000</span>
                        </div>
                        <div class="total-item">
                            <span>Subtotal</span>
                            <span class="total-valor">$50.000</span>
                        </div>
                        <div class="total-item">
                            <span>IVA (19%)</span>
                            <span class="total-valor">$9.500</span>
                        </div>
                        <div class="total-item total-final">
                            <span>Total</span>
                            <span class="total-valor">$59.500</span>
                        </div>
                    </div>
                </div>

                <div class="form-section">
                    <h2 class="section-title">Cupones y/o descuentos</h2>
                    <div class="cupon-group">
                        <input type="text" placeholder="Ingresa tu código de cupón">
                        <button type="button" class="btn-aplicar-cupon">Aplicar</button>
                    </div>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn-proceder">Proceder a pagar</button>
                    <button type="reset" class="btn-cancelar">Cancelar</button>
                </div>
            </form>
        </div>
    </main>

    <script>
        document.getElementById('menuToggle').addEventListener('click', function() {
            document.getElementById('sidebar').classList.toggle('open');
        });

        document.getElementById('profileToggle').addEventListener('click', function(e) {
            e.stopPropagation();
            document.getElementById('profileDropdown').classList.toggle('show');
        });

        document.addEventListener('click', function() {
            document.getElementById('profileDropdown').classList.remove('show');
        });
    </script>
