<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reportes</title>
    <link rel="stylesheet" href="css/master.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="dashboard-page">
    <!-- Topbar -->
    <header class="topbar">
        <button class="btn-hamburguer" id="menuToggle" aria-label="Abrir menú">☰</button>
        <div class="topbar-logo">Logo</div>
        <div class="topbar-profile" id="profileToggle">

            <div class="profile-dropdown" id="profileDropdown">
                <a href="#" id="logoutLink">Cerrar sesión</a>
            </div>
        </div>
    </header>

    <!-- Sidebar -->
    <nav class="sidebar" id="sidebar">
        <ul class="sidebar-menu">
            <li class="sidebar-item"><a href="dashboard.html">
                <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="#000000" viewBox="0 0 256 256"><path d="M219.31,108.68l-80-80a16,16,0,0,0-22.62,0l-80,80A15.87,15.87,0,0,0,32,120v96a8,8,0,0,0,8,8h64a8,8,0,0,0,8-8V160h32v56a8,8,0,0,0,8,8h64a8,8,0,0,0,8-8V120A15.87,15.87,0,0,0,219.31,108.68ZM208,208H160V152a8,8,0,0,0-8-8H104a8,8,0,0,0-8,8v56H48V120l80-80,80,80Z"></path></svg>
                Inicio
                </a></li>
            <li class="sidebar-item"><a href="productos.html">
                <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="#000000" viewBox="0 0 256 256"><path d="M223.68,66.15,135.68,18a15.88,15.88,0,0,0-15.36,0l-88,48.17a16,16,0,0,0-8.32,14v95.64a16,16,0,0,0,8.32,14l88,48.17a15.88,15.88,0,0,0,15.36,0l88-48.17a16,16,0,0,0,8.32-14V80.18A16,16,0,0,0,223.68,66.15ZM128,32l80.34,44-29.77,16.3-80.35-44ZM128,120,47.66,76l33.9-18.56,80.34,44ZM40,90l80,43.78v85.79L40,175.82Zm176,85.78h0l-80,43.79V133.82l32-17.51V152a8,8,0,0,0,16,0V107.55L216,90v85.77Z"></path></svg>
                Productos</a></li>
            <li class="sidebar-item"><a href="Clientes.html">
                <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="#000000" viewBox="0 0 256 256"><path d="M244.8,150.4a8,8,0,0,1-11.2-1.6A51.6,51.6,0,0,0,192,128a8,8,0,0,1-7.37-4.89,8,8,0,0,1,0-6.22A8,8,0,0,1,192,112a24,24,0,1,0-23.24-30,8,8,0,1,1-15.5-4A40,40,0,1,1,219,117.51a67.94,67.94,0,0,1,27.43,21.68A8,8,0,0,1,244.8,150.4ZM190.92,212a8,8,0,1,1-13.84,8,57,57,0,0,0-98.16,0,8,8,0,1,1-13.84-8,72.06,72.06,0,0,1,33.74-29.92,48,48,0,1,1,58.36,0A72.06,72.06,0,0,1,190.92,212ZM128,176a32,32,0,1,0-32-32A32,32,0,0,0,128,176ZM72,120a8,8,0,0,0-8-8A24,24,0,1,1,87.24,82a8,8,0,1,0,15.5-4A40,40,0,1,0,37,117.51,67.94,67.94,0,0,0,9.6,139.19a8,8,0,1,0,12.8,9.61A51.6,51.6,0,0,1,64,128,8,8,0,0,0,72,120Z"></path></svg>
                Clientes</a></li>
            <li class="sidebar-item"><a href="GestorVentas.html">
                <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="#000000" viewBox="0 0 256 256"><path d="M72,104a8,8,0,0,1,8-8h96a8,8,0,0,1,0,16H80A8,8,0,0,1,72,104Zm8,40h96a8,8,0,0,0,0-16H80a8,8,0,0,0,0,16ZM232,56V208a8,8,0,0,1-11.58,7.15L192,200.94l-28.42,14.21a8,8,0,0,1-7.16,0L128,200.94,99.58,215.15a8,8,0,0,1-7.16,0L64,200.94,35.58,215.15A8,8,0,0,1,24,208V56A16,16,0,0,1,40,40H216A16,16,0,0,1,232,56Zm-16,0H40V195.06l20.42-10.22a8,8,0,0,1,7.16,0L96,199.06l28.42-14.22a8,8,0,0,1,7.16,0L160,199.06l28.42-14.22a8,8,0,0,1,7.16,0L216,195.06Z"></path></svg>
                Ventas</a></li>
            <li class="sidebar-item active"><a href="reportes.html">
                <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="#000000" viewBox="0 0 256 256"><path d="M228.54,86.66l-176.06-54A16,16,0,0,0,32,48V192a16,16,0,0,0,16,16,16,16,0,0,0,4.52-.65L136,181.73V192a16,16,0,0,0,16,16h32a16,16,0,0,0,16-16v-29.9l28.54-8.75A16.09,16.09,0,0,0,240,138V102A16.09,16.09,0,0,0,228.54,86.66ZM136,165,48,192V48l88,27Zm48,27H152V176.82L184,167Zm40-54-.11,0L152,160.08V79.92l71.89,22,.11,0v36Z"></path></svg>
                Reportes</a></li>
        </ul>
    </nav>

    <!-- Contenido principal -->
    <main class="main-content">
        <div class="dashboard-container">
            <h1 class="dashboard-title">REPORTES</h1>

            <!-- Filtros de reporte -->
            <div class="search-filters">
                <div class="filter-group">
                    <select id="tipoReporte">
                        <option value="">-- Seleccione tipo de reporte --</option>
                        <option value="ventas">Reporte de Ventas</option>
                        <option value="inventario">Reporte de Inventario</option>
                        <option value="clientes">Reporte de Clientes</option>
                        <option value="proveedores">Reporte de Proveedores</option>
                    </select>
                    <select id="filtroCategoria">
                        <option value="">Todas las categorías</option>
                        <option value="bebidas">Bebidas</option>
                        <option value="alimentos">Alimentos</option>
                        <option value="aseo">Aseo</option>
                        <option value="tecnologia">Tecnología</option>
                    </select>
                    <input type="date" id="fechaInicio">
                    <input type="date" id="fechaFin">
                    <button class="btn-filter" id="btnGenerar">Generar Reporte</button>
                    <button class="btn-clear" id="btnLimpiar">Limpiar</button>
                </div>
            </div>

            <!-- Mensaje de validación -->
            <div id="mensajeValidacion" class="modal-message"></div>

            <!-- Resumen del reporte -->
            <div class="kpi-grid" id="resumenReporte" style="display:none;">
                <div class="kpi-card">
                    <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="#000000" viewBox="0 0 256 256"><path d="M224,200h-8V40a8,8,0,0,0-8-8H152a8,8,0,0,0-8,8V80H96a8,8,0,0,0-8,8v40H48a8,8,0,0,0-8,8v64H32a8,8,0,0,0,0,16H224a8,8,0,0,0,0-16ZM160,48h40V200H160ZM104,96h40V200H104ZM56,144H88v56H56Z"></path></svg>
                    <div class="kpi-content">
                        <h3>Total registros</h3>
                        <p class="kpi-value" id="kpiRegistros">0</p>
                    </div>
                </div>
                <div class="kpi-card">
                    <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="#000000" viewBox="0 0 256 256"><path d="M128,88a40,40,0,1,0,40,40A40,40,0,0,0,128,88Zm0,64a24,24,0,1,1,24-24A24,24,0,0,1,128,152ZM240,56H16a8,8,0,0,0-8,8V192a8,8,0,0,0,8,8H240a8,8,0,0,0,8-8V64A8,8,0,0,0,240,56ZM193.65,184H62.35A56.78,56.78,0,0,0,24,145.65v-35.3A56.78,56.78,0,0,0,62.35,72h131.3A56.78,56.78,0,0,0,232,110.35v35.3A56.78,56.78,0,0,0,193.65,184ZM232,93.37A40.81,40.81,0,0,1,210.63,72H232ZM45.37,72A40.81,40.81,0,0,1,24,93.37V72ZM24,162.63A40.81,40.81,0,0,1,45.37,184H24ZM210.63,184A40.81,40.81,0,0,1,232,162.63V184Z"></path></svg>
                    <div class="kpi-content">
                        <h3>Total valor</h3>
                        <p class="kpi-value" id="kpiValor">$0</p>
                    </div>
                </div>
                <div class="kpi-card">
                    <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="#000000" viewBox="0 0 256 256"><path d="M232,64H208V48a8,8,0,0,0-8-8H56a8,8,0,0,0-8,8V64H24A16,16,0,0,0,8,80V96a40,40,0,0,0,40,40h3.65A80.13,80.13,0,0,0,120,191.61V216H96a8,8,0,0,0,0,16h64a8,8,0,0,0,0-16H136V191.58c31.94-3.23,58.44-25.64,68.08-55.58H208a40,40,0,0,0,40-40V80A16,16,0,0,0,232,64ZM48,120A24,24,0,0,1,24,96V80H48v32q0,4,.39,8Zm144-8.9c0,35.52-29,64.64-64,64.9a64,64,0,0,1-64-64V56H192ZM232,96a24,24,0,0,1-24,24h-.5a81.81,81.81,0,0,0,.5-8.9V80h24Z"></path></svg>
                    <div class="kpi-content">
                        <h3>Promedio</h3>
                        <p class="kpi-value" id="kpiPromedio">$0</p>
                    </div>
                </div>
                <div class="kpi-card">
                    <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="#000000" viewBox="0 0 256 256"><path d="M173.66,98.34a8,8,0,0,1,0,11.32l-56,56a8,8,0,0,1-11.32,0l-24-24a8,8,0,0,1,11.32-11.32L112,148.69l50.34-50.35A8,8,0,0,1,173.66,98.34ZM232,128A104,104,0,1,1,128,24,104.11,104.11,0,0,1,232,128Zm-16,0a88,88,0,1,0-88,88A88.1,88.1,0,0,0,216,128Z"></path></svg>
                    <div class="kpi-content">
                        <h3>Estado</h3>
                        <p class="kpi-value" id="kpiEstado">-</p>
                    </div>
                </div>
            </div>

            <!-- Tabla de resultados -->
            <div class="table-container" id="tablaResultados" style="display:none;">
                <table class="product-table">
                    <thead id="tablaHeader"></thead>
                    <tbody id="tablaBody"></tbody>
                </table>
                <div class="table-footer">
                    <span class="table-info" id="tableInfo">Mostrando 0 registros</span>
                    <div class="pagination" id="paginacion"></div>
                </div>
            </div>

            <!-- Estado vacío -->
            <div class="chart-card" id="estadoVacio">
                <h3>Seleccione un tipo de reporte</h3>
                <p class="text-muted">Configure los filtros y haga clic en "Generar Reporte" para visualizar la información.</p>
            </div>

            <!-- Acciones de exportación -->
            <div class="form-actions" id="accionesExportar" style="display:none;">
                <button class="btn-cancel" id="btnImprimir">Imprimir</button>
                <button class="btn-proceder" id="btnExportarExcel">Exportar Excel</button>
                <button class="btn-proceder" id="btnExportarPDF">Exportar PDF</button>
            </div>
        </div>
    </main>

    <script>
        // ========== Toggle sidebar ==========
        document.getElementById('menuToggle').addEventListener('click', function() {
            document.getElementById('sidebar').classList.toggle('open');
        });

        // ========== Toggle perfil dropdown ==========
        document.getElementById('profileToggle').addEventListener('click', function(e) {
            e.stopPropagation();
            document.getElementById('profileDropdown').classList.toggle('show');
        });

        document.addEventListener('click', function() {
            document.getElementById('profileDropdown').classList.remove('show');
        });

        // ========== Cerrar sesión con SweetAlert ==========
        document.getElementById('logoutLink').addEventListener('click', function(e) {
            e.preventDefault();
            document.getElementById('profileDropdown').classList.remove('show');

            Swal.fire({
                title: '¿Seguro que quieres cerrar sesión?',
                text: 'Tendrás que iniciar sesión nuevamente para acceder al sistema.',
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#ff4757',
                cancelButtonColor: '#6c757d',
                confirmButtonText: 'Sí, cerrar sesión',
                cancelButtonText: 'No, cancelar',
                reverseButtons: true
            }).then((result) => {
                if (result.isConfirmed) {
                    Swal.fire({
                        title: '¡Sesión cerrada!',
                        text: 'Has cerrado sesión correctamente.',
                        icon: 'success',
                        timer: 1500,
                        showConfirmButton: false
                    }).then(() => {
                        window.location.href = 'index.html';
                    });
                }
            });
        });

        // ========== DATOS DE EJEMPLO ==========
        const datosVentas = [
            { id: 'FAC-001', fecha: '2026-09-01', cliente: 'Juan Pérez', producto: 'Coca-Cola 1.5L', cantidad: 10, total: 45000 },
            { id: 'FAC-002', fecha: '2026-09-02', cliente: 'María López', producto: 'Arroz Diana 500g', cantidad: 20, total: 78000 },
            { id: 'FAC-003', fecha: '2026-09-03', cliente: 'Carlos Ruiz', producto: 'Jabón Rey', cantidad: 15, total: 32000 },
            { id: 'FAC-004', fecha: '2026-09-04', cliente: 'Ana Torres', producto: 'Audífonos Sony', cantidad: 2, total: 240000 },
            { id: 'FAC-005', fecha: '2026-09-05', cliente: 'Juan Pérez', producto: 'Leche Alqueria', cantidad: 8, total: 36000 }
        ];

        const datosInventario = [
            { id: 'P001', producto: 'Coca-Cola 1.5L', categoria: 'Bebidas', stock: 45, stockMin: 20, precio: 4500 },
            { id: 'P002', producto: 'Arroz Diana 500g', categoria: 'Alimentos', stock: 12, stockMin: 15, precio: 3900 },
            { id: 'P003', producto: 'Jabón Rey', categoria: 'Aseo', stock: 60, stockMin: 25, precio: 2100 },
            { id: 'P004', producto: 'Audífonos Sony', categoria: 'Tecnología', stock: 8, stockMin: 10, precio: 120000 },
            { id: 'P005', producto: 'Leche Alqueria', categoria: 'Alimentos', stock: 30, stockMin: 15, precio: 4500 }
        ];

        const datosClientes = [
            { id: 'C001', nombre: 'Juan Pérez', email: 'juan@mail.com', telefono: '3001234567', compras: 15, total: 850000 },
            { id: 'C002', nombre: 'María López', email: 'maria@mail.com', telefono: '3009876543', compras: 8, total: 420000 },
            { id: 'C003', nombre: 'Carlos Ruiz', email: 'carlos@mail.com', telefono: '3005551234', compras: 22, total: 1250000 }
        ];

        const datosProveedores = [
            { id: 'PR001', nombre: 'Distribuidora El Sol', contacto: 'Pedro Gómez', telefono: '3101112233', productos: 45, calificacion: 4.5 },
            { id: 'PR002', nombre: 'Alimentos del Valle', contacto: 'Laura Díaz', telefono: '3104445566', productos: 28, calificacion: 4.8 },
            { id: 'PR003', nombre: 'TecnoImport', contacto: 'Andrés Mora', telefono: '3107778899', productos: 12, calificacion: 4.2 }
        ];

        // ========== REFERENCIAS ==========
        const tipoReporte = document.getElementById('tipoReporte');
        const fechaInicio = document.getElementById('fechaInicio');
        const fechaFin = document.getElementById('fechaFin');
        const btnGenerar = document.getElementById('btnGenerar');
        const btnLimpiar = document.getElementById('btnLimpiar');
        const mensajeValidacion = document.getElementById('mensajeValidacion');
        const resumenReporte = document.getElementById('resumenReporte');
        const tablaResultados = document.getElementById('tablaResultados');
        const tablaHeader = document.getElementById('tablaHeader');
        const tablaBody = document.getElementById('tablaBody');
        const tableInfo = document.getElementById('tableInfo');
        const estadoVacio = document.getElementById('estadoVacio');
        const accionesExportar = document.getElementById('accionesExportar');

        // ========== GENERAR REPORTE ==========
        btnGenerar.addEventListener('click', () => {
            const tipo = tipoReporte.value;

            mensajeValidacion.className = 'modal-message';
            mensajeValidacion.textContent = '';

            if (!tipo) {
                mostrarMensaje('Debe seleccionar al menos un tipo de reporte.', 'error');
                return;
            }

            if (fechaInicio.value && fechaFin.value && fechaInicio.value > fechaFin.value) {
                mostrarMensaje('Rango de fechas inválido: la fecha inicial no puede ser mayor que la final.', 'error');
                return;
            }

            let datos = [];
            switch (tipo) {
                case 'ventas': datos = datosVentas; break;
                case 'inventario': datos = datosInventario; break;
                case 'clientes': datos = datosClientes; break;
                case 'proveedores': datos = datosProveedores; break;
            }

            if (datos.length === 0) {
                mostrarMensaje('No se encontraron datos para los filtros aplicados.', 'error');
                return;
            }

            mostrarMensaje('Reporte generado exitosamente.', 'success');
            renderizarReporte(tipo, datos);
        });

        btnLimpiar.addEventListener('click', () => {
            tipoReporte.value = '';
            fechaInicio.value = '';
            fechaFin.value = '';
            document.getElementById('filtroCategoria').value = '';
            resumenReporte.style.display = 'none';
            tablaResultados.style.display = 'none';
            accionesExportar.style.display = 'none';
            estadoVacio.style.display = 'block';
            mensajeValidacion.className = 'modal-message';
            mensajeValidacion.textContent = '';
        });

        function mostrarMensaje(texto, tipo) {
            mensajeValidacion.textContent = texto;
            mensajeValidacion.className = 'modal-message ' + tipo;
        }

        function renderizarReporte(tipo, datos) {
            estadoVacio.style.display = 'none';
            resumenReporte.style.display = 'grid';
            tablaResultados.style.display = 'block';
            accionesExportar.style.display = 'flex';

            const totalRegistros = datos.length;
            let totalValor = 0;

            if (tipo === 'ventas') totalValor = datos.reduce((s, d) => s + d.total, 0);
            if (tipo === 'clientes') totalValor = datos.reduce((s, d) => s + d.total, 0);
            if (tipo === 'inventario') totalValor = datos.reduce((s, d) => s + d.stock * d.precio, 0);
            const promedio = totalValor / totalRegistros;

            document.getElementById('kpiRegistros').textContent = totalRegistros;
            document.getElementById('kpiValor').textContent = '$' + totalValor.toLocaleString('es-CO');
            document.getElementById('kpiPromedio').textContent = '$' + Math.round(promedio).toLocaleString('es-CO');
            document.getElementById('kpiEstado').textContent = 'OK';

            let headers = [];
            let filas = [];

            if (tipo === 'ventas') {
                headers = ['ID', 'Fecha', 'Cliente', 'Producto', 'Cantidad', 'Total'];
                filas = datos.map(d => [d.id, d.fecha, d.cliente, d.producto, d.cantidad, '$' + d.total.toLocaleString('es-CO')]);
            } else if (tipo === 'inventario') {
                headers = ['ID', 'Producto', 'Categoría', 'Stock', 'Stock Mínimo', 'Precio', 'Estado'];
                filas = datos.map(d => [
                    d.id, d.producto, d.categoria, d.stock, d.stockMin,
                    '$' + d.precio.toLocaleString('es-CO'),
                    d.stock < d.stockMin
                        ? '<span class="status-badge low-stock">Stock Bajo</span>'
                        : '<span class="status-badge active">Disponible</span>'
                ]);
            } else if (tipo === 'clientes') {
                headers = ['ID', 'Nombre', 'Email', 'Teléfono', 'Compras', 'Total'];
                filas = datos.map(d => [d.id, d.nombre, d.email, d.telefono, d.compras, '$' + d.total.toLocaleString('es-CO')]);
            } else if (tipo === 'proveedores') {
                headers = ['ID', 'Proveedor', 'Contacto', 'Teléfono', 'Productos', 'Calificación'];
                filas = datos.map(d => [d.id, d.nombre, d.contacto, d.telefono, d.productos, d.calificacion]);
            }

            tablaHeader.innerHTML = '<tr>' + headers.map(h => `<th>${h}</th>`).join('') + '</tr>';
            tablaBody.innerHTML = filas.map(f => '<tr>' + f.map(c => `<td>${c}</td>`).join('') + '</tr>').join('');

            tableInfo.textContent = `Mostrando ${datos.length} registro(s)`;
        }

        // ========== BOTONES ==========
        document.getElementById('btnImprimir').addEventListener('click', () => window.print());
        document.getElementById('btnExportarExcel').addEventListener('click', () => {
            Swal.fire({ icon: 'success', title: 'Exportando...', text: 'El reporte se está exportando a Excel.', timer: 1500, showConfirmButton: false });
        });
        document.getElementById('btnExportarPDF').addEventListener('click', () => {
            Swal.fire({ icon: 'success', title: 'Exportando...', text: 'El reporte se está exportando a PDF.', timer: 1500, showConfirmButton: false });
        });
    </script>
</body>
</html>
